<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lizard!</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    font-family: system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lizardButton {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    background: #43a047;
    color: white;
    font-size: 5rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 -6px 0 rgba(0, 0, 0, 0.25);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #lizardButton:hover { background: #4caf50; }
  #lizardButton:active {
    transform: translateY(3px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>
  <button id="lizardButton" aria-label="Lizard">🦎</button>
  <script>
    const btn = document.getElementById('lizardButton');

    function sayLizard() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance('Lizard');
      utter.rate = 1;
      utter.pitch = 1;
      utter.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => /^en/i.test(v.lang));
      if (preferred) utter.voice = preferred;
      window.speechSynthesis.speak(utter);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    btn.addEventListener('click', sayLizard);
  </script>
</body>
</html>
